import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.security.MessageDigest

// Run with: gradlew -I scripts/fdroid-audit.init.gradle :app:fdroidAudit
// Resolves the real release classpath; it does not compile or sign the app.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('fdroidAudit') {
        doLast {
            def artifacts = app.configurations.getByName('releaseRuntimeClasspath')
                .resolvedConfiguration.resolvedArtifacts
                .findAll { it.id.componentIdentifier instanceof ModuleComponentIdentifier }
                .collect { artifact ->
                    def id = artifact.moduleVersion.id
                    def digest = MessageDigest.getInstance('SHA-256')
                    artifact.file.withInputStream { input ->
                        byte[] buffer = new byte[65536]
                        int size
                        while ((size = input.read(buffer)) != -1) digest.update(buffer, 0, size)
                    }
                    [coordinate: "${id.group}:${id.name}:${id.version}".toString(),
                     file: artifact.file.name, type: artifact.type,
                     sha256: digest.digest().encodeHex().toString()]
                }.unique { artifact -> [artifact.coordinate, artifact.file, artifact.type, artifact.sha256] }
                .sort { a, b -> a.coordinate <=> b.coordinate }
            def output = gradle.rootProject.file('dist/fdroid-release-artifacts.json')
            output.parentFile.mkdirs()
            output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(artifacts)) + '\n', 'UTF-8')
            println "Audited ${artifacts.size()} external release artifacts; report: ${output}"
        }
    }
}
